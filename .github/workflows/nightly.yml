name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  check-cairo-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "20.x"
      - run: bin/check-cairo-snippets.sh
